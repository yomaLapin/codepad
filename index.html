<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d1f23">
  <meta name="description" content="Studio NMT 개인용 간단 코드 편집기">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="./styles.css">
  <title>Studio NMT · Code Pad</title>
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <button id="menuToggle" class="icon-btn" type="button" aria-label="파일 탐색기 열기/닫기" title="파일 탐색기">☰</button>
    <div class="brand"><strong>Studio NMT</strong><span>CODE PAD</span></div>
    <div class="top-actions">
      <span id="versionLabel" class="version">v0.4.3</span>
      <button id="fullscreenBtn" class="tool-btn" type="button">전체화면</button>
    </div>
  </header>

  <section id="filePanel" class="file-panel collapsed" aria-label="파일 탐색기">
    <div class="panel-heading">
      <strong>파일 탐색기</strong>
      <div class="panel-actions">
        <div class="open-menu-wrap">
          <button id="openBtn" class="small-btn" type="button" aria-expanded="false" aria-controls="openMenu">열기 ▾</button>
          <div id="openMenu" class="open-menu" hidden>
            <button id="openFilesBtn" type="button">파일 선택</button>
            <button id="openFolderBtn" type="button">폴더 선택</button>
          </div>
        </div>
      </div>
    </div>
    <div id="treeRoot" class="tree-root"><p class="empty-tree">불러온 파일이 여기에 표시됩니다.</p></div>
    <input id="fileInput" type="file" multiple hidden>
    <input id="folderInput" type="file" webkitdirectory directory multiple hidden>
  </section>

  <main id="workspace" class="workspace">
    <section id="previewPane" class="pane preview-pane collapsed">
      <div class="pane-toolbar">
        <div class="pane-title"><span class="status-dot"></span> 미리보기</div>
        <div class="pane-actions">
          <button id="runBtn" class="primary-btn" type="button">▶ 실행</button>
          <button id="refreshBtn" class="small-btn" type="button">새로고침</button>
          <button id="previewFullscreenBtn" class="small-btn" type="button">전체화면</button>
          <button id="togglePreviewBtn" class="small-btn" type="button" aria-expanded="false" aria-controls="previewContent">펼치기</button>
        </div>
      </div>
      <div id="previewContent" class="preview-content">
        <iframe id="previewFrame" title="HTML 실행 미리보기" sandbox="allow-scripts allow-forms allow-modals allow-downloads"></iframe>
        <div id="previewPlaceholder" class="preview-placeholder">
          <div class="placeholder-icon">⌘</div>
          <strong>실행 결과가 여기에 표시됩니다.</strong>
          <span>코드를 작성하거나 HTML 파일을 열고 실행을 눌러보세요.</span>
        </div>
      </div>
    </section>

    <section id="editorPane" class="pane editor-pane">
      <div class="pane-toolbar editor-toolbar">
        <div class="pane-title"><span id="fileIcon">▤</span><span id="activeFileName">새 문서</span><span id="dirtyMark" class="dirty-mark"></span></div>
        <div class="pane-actions">
          <button id="newBtn" class="small-btn" type="button">새 문서</button>
          <button id="saveBtn" class="small-btn" type="button">저장</button>
          <button id="saveAsBtn" class="small-btn" type="button">다른 이름 저장</button>
        </div>
      </div>
      <div class="editor-wrap">
        <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="텍스트 편집기" placeholder="여기에 코드를 붙여넣거나 작성하세요."></textarea>
      </div>
      <div class="editor-status">
        <span id="languageLabel">TEXT</span><span id="cursorLabel">Ln 1, Col 1</span><span id="saveStatus">새 문서</span>
      </div>
    </section>
  </main>
</div>

<div id="saveDialog" class="dialog-backdrop" hidden>
  <form id="saveForm" class="dialog">
    <h2>파일 저장</h2>
    <label>파일 이름<input id="saveName" required value="새 문서" autocomplete="off"></label>
    <label>확장자
      <select id="saveExtension" required>
        <option value="" selected disabled>확장자 선택</option>
        <option>.html</option><option>.htm</option><option>.css</option><option>.js</option>
        <option>.json</option><option>.py</option><option>.java</option><option>.c</option>
        <option>.cpp</option><option>.cs</option><option>.php</option><option>.sql</option>
        <option>.xml</option><option>.md</option><option>.txt</option><option value="custom">직접 입력</option>
      </select>
    </label>
    <label id="customExtensionWrap" hidden>직접 입력<input id="customExtension" placeholder="예: .html" autocomplete="off"></label>
    <div class="dialog-actions"><button type="button" id="cancelSaveBtn">취소</button><button class="primary-btn" type="submit">저장</button></div>
  </form>
</div>

<div id="updateBanner" class="update-banner" hidden>
  <span>새 버전이 준비되었습니다.</span>
  <button id="applyUpdateBtn" class="primary-btn" type="button">업데이트 적용</button>
  <button id="dismissUpdateBtn" class="small-btn" type="button">나중에</button>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="./js/app.js"></script>
</body>
</html>
