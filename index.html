<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NMT Note</title>
    <!-- PWA 매니페스트 연결 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#333333">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons (가볍고 깔끔한 아이콘) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* 커스텀 스크롤바 디자인 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
        
        /* 텍스트 영역 테두리 제거 및 클릭 시 아웃라인 제거 */
        #editor:focus {
            outline: none;
            box-shadow: none;
        }

        /* 모바일에서 텍스트 에디터 자동 확대 방지 */
        input, textarea {
            font-size: 16px !important; 
        }

        /* 기본 다크(Dark) 테마 변수 (다크그레이 & 웜화이트) */
        :root {
            --bg-color: #333333;
            --text-color: #F2F0E9;
            --sidebar-bg: #2a2a2a;
            --header-bg: #222222;
            --border-color: #444444;
            --hover-bg: #444444;
            --input-bg: #444444;
            --icon-color: #bbbbbb;
        }

        /* 라이트(Light) 테마 변수 (Tailwind 기본값과 유사하게 매핑) */
        body.light-theme {
            --bg-color: #ffffff;
            --text-color: #1f2937; /* gray-800 */
            --sidebar-bg: #f9fafb; /* gray-50 */
            --header-bg: #ffffff;
            --border-color: #e5e7eb; /* gray-200 */
            --hover-bg: #f3f4f6; /* gray-100 */
            --input-bg: transparent;
            --icon-color: #9ca3af; /* gray-400 */
        }

        /* 테마 적용 클래스 */
        .theme-bg { background-color: var(--bg-color); color: var(--text-color); transition: background-color 0.3s, color 0.3s; }
        .theme-sidebar { background-color: var(--sidebar-bg); border-color: var(--border-color); }
        .theme-header { background-color: var(--header-bg); border-color: var(--border-color); }
        .theme-border { border-color: var(--border-color); }
        .theme-hover:hover { background-color: var(--hover-bg); }
        .theme-icon { color: var(--icon-color); }
        
        .theme-input-container { background-color: var(--input-bg); border-color: var(--border-color); }
        
        textarea#editor {
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        input#filenameInput {
            color: var(--text-color);
        }

        /* 테마 변경 버튼 스타일 */
        .theme-btn {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            box-sizing: border-box;
        }
        .theme-light-btn { background: #ffffff; border: 2px solid #000000; }
        .theme-dark-btn { background: #333333; border: 2px solid #ffffff; }

    </style>
</head>
<body class="theme-bg font-sans h-screen w-full overflow-hidden flex flex-col md:flex-row">

    <!-- 모바일 사이드바 배경 오버레이 -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden" onclick="toggleSidebar()"></div>

    <!-- 사이드바 (로컬 스토리지 파일 목록) -->
    <aside id="sidebar" class="theme-sidebar border-r w-64 h-full fixed md:relative z-30 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-4 border-b theme-border flex justify-between items-center theme-header">
            <h2 class="font-bold flex items-center gap-2">
                <i class="ph ph-files text-xl"></i>
                [내 파일]
            </h2>
            <div class="flex items-center gap-3">
                <!-- 테마 변경 버튼 2개 -->
                <div class="flex gap-2">
                    <div class="theme-btn theme-light-btn" onclick="setTheme('light')" title="라이트 테마"></div>
                    <div class="theme-btn theme-dark-btn" onclick="setTheme('dark')" title="다크 테마"></div>
                </div>
                <button class="md:hidden text-gray-500 hover:text-gray-800 p-1" onclick="toggleSidebar()">
                    <i class="ph ph-x text-xl"></i>
                </button>
            </div>
        </div>
        
        <!-- PWA 강제 설치 버튼 -->
        <div class="p-2 border-b theme-border">
            <button id="installBtn" class="w-full hidden p-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md text-sm font-bold transition-colors">
                <i class="ph ph-download-simple mr-1"></i> 앱 설치하기 (PWA)
            </button>
        </div>

        <!-- 파일 리스트 -->
        <div id="fileList" class="flex-1 overflow-y-auto p-2">
            <!-- 자바스크립트로 파일 목록이 렌더링 됩니다 -->
        </div>

        <!-- 버전 및 제작자 표기 -->
        <div class="p-4 border-t theme-border text-center theme-sidebar">
            <strong class="block text-base mb-1">NMT Note</strong>
            <span class="text-xs text-gray-500">yomaLapin(202611-001)</span>
        </div>
    </aside>

    <!-- 메인 에디터 영역 -->
    <main class="flex-1 h-full flex flex-col min-w-0 relative z-10 theme-bg">
        
        <!-- 툴바 (헤더) -->
        <header class="flex items-center justify-between p-2 md:p-3 border-b theme-border theme-header shadow-sm shrink-0">
            <div class="flex items-center gap-2 flex-1 min-w-0">
                <button class="md:hidden p-2 theme-icon theme-hover rounded-md transition-colors" onclick="toggleSidebar()">
                    <i class="ph ph-list text-2xl"></i>
                </button>
                
                <div class="flex items-center flex-1 max-w-sm border rounded-md px-3 py-1.5 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500 transition-all theme-input-container">
                    <i class="ph ph-file-text theme-icon mr-2"></i>
                    <input type="text" id="filenameInput" placeholder="untitled.txt" class="w-full bg-transparent border-none focus:outline-none text-sm md:text-base font-medium placeholder-gray-400" autocomplete="off">
                </div>
            </div>

            <!-- 액션 버튼들 -->
            <div class="flex items-center gap-1 md:gap-2 ml-2">
                <button onclick="newFile()" class="p-2 theme-icon theme-hover rounded-md transition-colors flex items-center gap-1" title="새 파일">
                    <i class="ph ph-plus-circle text-xl"></i>
                    <span class="hidden md:inline text-sm font-medium text-current">새로 만들기</span>
                </button>

                <!-- 숨겨진 파일 입력 필드 (로컬 기기에서 불러오기 용) -->
                <input type="file" id="fileInput" class="hidden" onchange="importFile(event)">
                <button onclick="document.getElementById('fileInput').click()" class="p-2 theme-icon theme-hover rounded-md transition-colors flex items-center gap-1" title="기기에서 불러오기">
                    <i class="ph ph-upload-simple text-xl"></i>
                    <span class="hidden md:inline text-sm font-medium text-current">불러오기</span>
                </button>

                <div class="w-px h-6 bg-gray-500 mx-1"></div> <!-- 구분선 -->

                <button onclick="saveToLocalStorage()" class="p-2 text-blue-500 hover:text-blue-400 theme-hover rounded-md transition-colors flex items-center gap-1" title="브라우저에 저장">
                    <i class="ph ph-floppy-disk text-xl"></i>
                    <span class="hidden md:inline text-sm font-medium">저장</span>
                </button>

                <button onclick="exportFile()" class="p-2 theme-icon theme-hover rounded-md transition-colors flex items-center gap-1" title="기기로 다운로드">
                    <i class="ph ph-download-simple text-xl"></i>
                </button>
            </div>
        </header>

        <!-- 에디터 (Textarea) -->
        <div class="flex-1 flex w-full relative">
            <textarea id="editor" class="w-full h-full p-4 md:p-6 resize-none font-mono text-sm md:text-base leading-relaxed" placeholder="내용을 입력하세요... (코드를 작성하거나 메모를 남겨보세요)" spellcheck="false"></textarea>
        </div>
    </main>

    <!-- 커스텀 알림 모달 (alert 대체) -->
    <div id="msgModal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center opacity-0 transition-opacity duration-200 text-gray-800">
        <div class="bg-white rounded-lg shadow-xl max-w-sm w-full mx-4 transform scale-95 transition-transform duration-200" id="msgModalContent">
            <div class="p-5">
                <h3 class="text-lg font-bold mb-2" id="msgTitle">알림</h3>
                <p class="text-gray-600 text-sm md:text-base" id="msgText">메시지 내용</p>
            </div>
            <div class="px-5 py-3 bg-gray-50 border-t border-gray-200 rounded-b-lg flex justify-end gap-2">
                <button id="msgCancelBtn" class="hidden px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded hover:bg-gray-100 transition-colors" onclick="closeMsg()">취소</button>
                <button id="msgOkBtn" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded hover:bg-blue-700 transition-colors" onclick="closeMsg()">확인</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. 테마(배경색) 설정 로직 ---
        function setTheme(themeName) {
            if (themeName === 'light') {
                document.body.classList.add('light-theme');
            } else {
                document.body.classList.remove('light-theme');
            }
            localStorage.setItem('nmtnote_theme', themeName);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('nmtnote_theme');
            if (savedTheme === 'light') {
                setTheme('light');
            } else {
                setTheme('dark'); // 디폴트는 다크
            }
            loadFilesFromStorage();
            renderFileList();
            
            if (Object.keys(savedFiles).length === 0) {
                newFile();
            }
        });

        // --- 2. PWA 설치 로직 ---
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (!window.matchMedia('(display-mode: standalone)').matches) {
                installBtn.style.display = 'block';
                installBtn.classList.remove('hidden');
            }
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
        });

        // DOM 요소 캐싱
        const editor = document.getElementById('editor');
        const filenameInput = document.getElementById('filenameInput');
        const fileListContainer = document.getElementById('fileList');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        // NMT Note 전용 저장소 접두어 사용 (충돌 방지)
        const STORAGE_PREFIX = 'nmtnote_file_';
        let savedFiles = {};
        let currentEditingFile = null;

        // --- 파일 관리 로직 ---
        function loadFilesFromStorage() {
            savedFiles = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith(STORAGE_PREFIX)) {
                    const displayFileName = key.replace(STORAGE_PREFIX, '');
                    savedFiles[displayFileName] = localStorage.getItem(key);
                }
            }
        }

        function saveFilesToStorage(filename, content) {
            try {
                localStorage.setItem(STORAGE_PREFIX + filename, content);
                loadFilesFromStorage(); // 딕셔너리 갱신
                renderFileList();
            } catch (e) {
                showMsg('저장 실패', '기기 저장 공간이 부족하거나 오류가 발생했습니다.');
            }
        }

        function newFile() {
            editor.value = '';
            filenameInput.value = 'untitled.txt';
            currentEditingFile = null;
            if (window.innerWidth < 768) closeSidebar();
        }

        function saveToLocalStorage() {
            let filename = filenameInput.value.trim();
            const content = editor.value;

            if (!filename) {
                filename = 'untitled.txt';
                filenameInput.value = filename;
            }

            saveFilesToStorage(filename, content);
            currentEditingFile = filename;
            showMsg('저장 완료', `[${filename}] 브라우저에 저장되었습니다.`);
        }

        function openFile(filename) {
            if (savedFiles[filename] !== undefined) {
                editor.value = savedFiles[filename];
                filenameInput.value = filename;
                currentEditingFile = filename;
                if (window.innerWidth < 768) closeSidebar();
            }
        }

        function deleteFile(filename, event) {
            event.stopPropagation();
            
            showMsg('파일 삭제', `[${filename}] 파일을 삭제하시겠습니까?`, true, function() {
                localStorage.removeItem(STORAGE_PREFIX + filename);
                loadFilesFromStorage(); // 삭제 후 딕셔너리 재구축
                renderFileList();
                
                if (currentEditingFile === filename) {
                    newFile();
                }
            });
        }

        // --- 외부 기기 파일 연동 ---
        function importFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                editor.value = content;
                filenameInput.value = file.name;
                currentEditingFile = null; 
                saveToLocalStorage();
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function exportFile() {
            const content = editor.value;
            let filename = filenameInput.value.trim() || 'untitled.txt';
            
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // --- UI 렌더링 및 인터랙션 ---
        function renderFileList() {
            fileListContainer.innerHTML = '';
            const filenames = Object.keys(savedFiles);
            
            if (filenames.length === 0) {
                fileListContainer.innerHTML = `
                    <div class="text-center text-gray-500 text-sm mt-10">
                        <i class="ph ph-folder-open text-4xl mb-2 theme-icon"></i><br>
                        저장된 파일이 없습니다.
                    </div>
                `;
                return;
            }

            filenames.forEach(filename => {
                const item = document.createElement('div');
                item.className = 'group flex items-center justify-between p-2 mb-1 rounded cursor-pointer theme-hover transition-colors';
                
                let icon = 'ph-file-text';
                if(filename.endsWith('.html')) icon = 'ph-file-html';
                else if(filename.endsWith('.js')) icon = 'ph-file-js';
                else if(filename.endsWith('.py')) icon = 'ph-file-code';
                
                item.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden flex-1" onclick="openFile('${filename}')">
                        <i class="ph ${icon} theme-icon text-lg flex-shrink-0"></i>
                        <span class="text-sm truncate font-medium">${filename}</span>
                    </div>
                    <button class="text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-1 md:opacity-100" onclick="deleteFile('${filename}', event)">
                        <i class="ph ph-trash"></i>
                    </button>
                `;
                fileListContainer.appendChild(item);
            });
        }

        function toggleSidebar() {
            if (sidebar.classList.contains('-translate-x-full')) {
                openSidebar();
            } else {
                closeSidebar();
            }
        }
        function openSidebar() {
            sidebar.classList.remove('-translate-x-full');
            sidebarOverlay.classList.remove('hidden');
        }
        function closeSidebar() {
            sidebar.classList.add('-translate-x-full');
            sidebarOverlay.classList.add('hidden');
        }

        // Tab 키 띄어쓰기 4칸 적용
        editor.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
            }
        });

        // --- 커스텀 모달(Alert 대체) ---
        let msgConfirmCallback = null;

        function showMsg(title, text, isConfirm = false, onConfirm = null) {
            const modal = document.getElementById('msgModal');
            const content = document.getElementById('msgModalContent');
            const titleEl = document.getElementById('msgTitle');
            const textEl = document.getElementById('msgText');
            const cancelBtn = document.getElementById('msgCancelBtn');

            titleEl.textContent = title;
            textEl.textContent = text;
            
            if (isConfirm) {
                cancelBtn.classList.remove('hidden');
                msgConfirmCallback = onConfirm;
            } else {
                cancelBtn.classList.add('hidden');
                msgConfirmCallback = null;
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);
        }

        function closeMsg() {
            const modal = document.getElementById('msgModal');
            const content = document.getElementById('msgModalContent');
            
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                if(msgConfirmCallback && event && event.target.id === 'msgOkBtn') {
                    msgConfirmCallback();
                }
            }, 200);
        }

        // --- 서비스 워커 등록 (PWA 동작용) ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then((reg) => {
                    console.log('NMT Note Service Worker 등록 완료', reg);
                }).catch((err) => {
                    console.log('Service Worker 등록 실패', err);
                });
            });
        }
    </script>
</body>
</html>
